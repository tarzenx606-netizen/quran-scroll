name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter project
        run: |
          flutter create --platforms=android --org com.quranscroll --project-name quran_scroll proj
          cp app/pubspec.yaml proj/pubspec.yaml
          cp app/main.dart proj/lib/main.dart
          mkdir -p proj/assets/data
      - name: Download Quran data
        working-directory: proj
        run: |
          B=https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist
          for l in en ur tr id; do curl -fsSL "$B/quran_$l.json" -o "assets/data/quran_$l.json"; done
          curl -fsSL "https://tanzil.net/trans/?transID=hi.hindi&type=txt-2" -o assets/data/hi.txt || : > assets/data/hi.txt
      - name: Verify Quran data (114 surahs, 6236 ayat)
        working-directory: proj
        run: |
          python3 - <<'EOF'
          import json
          for l in ['en','ur','tr','id']:
              d = json.load(open('assets/data/quran_%s.json' % l, encoding='utf-8'))
              n = sum(len(c['verses']) for c in d)
              assert len(d) == 114 and n == 6236, (l, len(d), n)
              print(l, 'OK', len(d), n)
          EOF
      - name: Android settings
        working-directory: proj
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' $M
          sed -i 's/android:label="[^"]*"/android:label="Quran Scroll"/' $M
      - name: Build APK
        working-directory: proj
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quran-scroll-apk
          path: proj/build/app/outputs/flutter-apk/app-release.apk
